name: OAuth Start Preflight

on:
  workflow_dispatch:
    inputs:
      continue_uris:
        description: "Optional comma-separated HTTPS continue URIs to check instead of the masked default secret."
        required: false
        type: string
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

jobs:
  google_oauth_start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Google OAuth Start Preflight
        env:
          OAUTH_PREFLIGHT_REQUIRED: "true"
          OAUTH_PREFLIGHT_CONTINUE_URIS: ${{ github.event.inputs.continue_uris || secrets.OAUTH_PREFLIGHT_CONTINUE_URIS }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: npm run check:oauth
