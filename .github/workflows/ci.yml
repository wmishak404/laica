name: CI (Typecheck, Unit, E2E)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck + Lint
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm run test:unit

      - name: Unit Coverage Baseline
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload Unit Coverage Summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

  e2e_guest_smoke:
    # This job is intentionally conditional: it needs a dedicated test Firebase project and Neon project.
    if: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
      && vars.NEON_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Preflight Secrets
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LAICA_DEV_AUTH_ENABLED: "true"
          LAICA_DEV_AUTH_SECRET: gha-${{ github.run_id }}-${{ github.run_attempt }}
          LAICA_DEV_AUTH_ALLOWED_USERS: dev-test-linked-ci dev-test-linked-browser-ci
          VITE_LAICA_DEV_AUTH_BROWSER: "true"
        run: |
          missing=()
          for var in NEON_API_KEY FIREBASE_SERVICE_ACCOUNT_BASE64 VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID ELEVENLABS_API_KEY LAICA_DEV_AUTH_ENABLED LAICA_DEV_AUTH_SECRET LAICA_DEV_AUTH_ALLOWED_USERS VITE_LAICA_DEV_AUTH_BROWSER; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done

          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets for e2e_guest_smoke job:"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Create Neon Branch (schema-only)
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          branch_type: schema-only

      - name: Install
        run: npm ci

      - name: DB Push (apply schema)
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: npx drizzle-kit push --force

      - name: DB Schema Health
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: npm run db:health

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (guest + linked dev-auth smoke)
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          LAICA_DEV_AUTH_ENABLED: "true"
          LAICA_DEV_AUTH_SECRET: gha-${{ github.run_id }}-${{ github.run_attempt }}
          LAICA_DEV_AUTH_ALLOWED_USERS: dev-test-linked-ci dev-test-linked-browser-ci
          VITE_LAICA_DEV_AUTH_BROWSER: "true"
        run: npm run test:e2e

      - name: Delete Neon Branch
        if: ${{ always() }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
