name: Dependency Audit (High/Critical)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Audit (fail on high/critical)
        run: |
          audit_status=0
          summary_status=0
          npm audit --audit-level=high --json > "$RUNNER_TEMP/laica-npm-audit.json" 2> "$RUNNER_TEMP/laica-npm-audit.stderr" || audit_status=$?
          node --input-type=module - "$RUNNER_TEMP/laica-npm-audit.json" <<'NODE' || summary_status=$?
          import { readFileSync } from "node:fs";
          try {
            const report = JSON.parse(readFileSync(process.argv[2], "utf8"));
            const counts = report.metadata?.vulnerabilities;
            if (report.error || !counts || !["low", "moderate", "high", "critical"].every(key => Number.isInteger(counts[key]) && counts[key] >= 0)) {
              throw new Error("Invalid audit report");
            }
            console.log(`Dependency audit: ${counts.low} low, ${counts.moderate} moderate, ${counts.high} high, ${counts.critical} critical.`);
            if (counts.high || counts.critical) process.exitCode = 1;
          } catch {
            console.error("Dependency audit could not be verified. Review private security tooling; raw diagnostics are not published.");
            process.exitCode = 1;
          }
          NODE
          if [ "$audit_status" -ne 0 ]; then exit "$audit_status"; fi
          exit "$summary_status"
