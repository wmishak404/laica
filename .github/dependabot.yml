version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Disable routine version PRs without disabling Dependabot security updates.
    open-pull-requests-limit: 0
    groups:
      npm-production-security:
        applies-to: "security-updates"
        dependency-type: "production"
        patterns:
          - "*"
      npm-development-security:
        applies-to: "security-updates"
        dependency-type: "development"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions-patch-minor-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
